<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover is what lets the safe-area insets in index.css
         actually do anything once installed to the home screen. Without it the
         app is letterboxed away from the notch instead of drawing behind it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Planner</title>
    <meta name="description" content="Personal planner" />

    <!-- Matches --ink-900, so the status bar and the app agree and there is no
         white flash on launch. -->
    <meta name="theme-color" content="#15161D" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS reads these rather than the web manifest for home-screen installs. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The planner holds personal health and coursework data. It has no
         business appearing in a search index. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts are self-hosted, so preloading the two used above the fold
         removes the only remaining text reflow on launch. -->
    <link
      rel="preload"
      href="/fonts/PublicSans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/SpaceGrotesk-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
