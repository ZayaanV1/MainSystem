<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover is what lets the safe-area insets in index.css
         actually do anything once installed to the home screen. Without it the
         app is letterboxed away from the notch instead of drawing behind it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Planner</title>
    <meta name="description" content="Personal planner" />

    <!-- Matches --ink-900, so the status bar and the app agree and there is no
         white flash on launch. -->
    <!-- Overwritten before paint by the script below, which is the
         only way to avoid a flash of the wrong palette. The value here is the
         dark ink-900, matching the default. -->
    <meta name="theme-color" content="#13100c" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS reads these rather than the web manifest for home-screen installs. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The planner holds personal health and coursework data. It has no
         business appearing in a search index. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts are self-hosted, so preloading the two used above the fold
         removes the only remaining text reflow on launch: the body face, and
         the display face the masthead is set in. This preloaded Space Grotesk
         for a month after it was retired, downloading a font nothing used on
         every launch while the masthead's face arrived late and reflowed. -->
    <link
      rel="preload"
      href="/fonts/PublicSans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/SchibstedGrotesk-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Theme, applied before the first paint.

      This has to be a blocking script in <head> and not a React effect: an effect
      runs AFTER paint, so a light-mode user would see a full frame of the dark
      palette on every load. Kept deliberately tiny and duplicated from
      src/lib/theme.ts rather than imported, because importing it would mean
      waiting for the bundle — which is the thing being avoided.
    -->
    <!--
      The theme (per account, cached here) and the mode (per device) are both
      applied before paint. GROUNDS is each theme's --ink-900 in dark and
      light, written in at build time from tokens.css, so the status bar
      cannot drift from the ground.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
