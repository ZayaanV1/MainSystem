<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover is what lets the safe-area insets in index.css
         actually do anything once installed to the home screen. Without it the
         app is letterboxed away from the notch instead of drawing behind it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Planner</title>
    <meta name="description" content="Personal planner" />

    <!-- Matches --ink-900, so the status bar and the app agree and there is no
         white flash on launch. -->
    <!-- Overwritten before paint by the inline script below, which is the
         only way to avoid a flash of the wrong palette. The value here is the
         dark ink-900, matching the default. -->
    <meta name="theme-color" content="#13100c" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS reads these rather than the web manifest for home-screen installs. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The planner holds personal health and coursework data. It has no
         business appearing in a search index. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts are self-hosted, so preloading the two used above the fold
         removes the only remaining text reflow on launch. -->
    <link
      rel="preload"
      href="/fonts/PublicSans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/SpaceGrotesk-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Theme, applied before the first paint.

      This has to be a blocking inline script and not a React effect: an effect
      runs AFTER paint, so a light-mode user would see a full frame of the dark
      palette on every load. Kept deliberately tiny and duplicated from
      src/lib/theme.ts rather than imported, because importing it would mean
      waiting for the bundle — which is the thing being avoided.
    -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('planner.theme');
          if (c === 'light' || c === 'dark') {
            document.documentElement.setAttribute('data-theme', c);
          }
          var dark =
            c === 'dark' ||
            (c !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#13100c' : '#f7f3ec');
        } catch (e) {
          /* storage unavailable — the media query still decides */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
