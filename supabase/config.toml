project_id = "life-planner"

[functions.dispatch]
# The scheduler authenticates with a shared secret header rather than a JWT,
# because pg_cron has no user session to present. The function verifies the
# secret itself in constant time, and falls back to verifying a real user JWT
# for the "send test digest now" path. Leaving this true would block pg_cron.
verify_jwt = false

[functions.parse-food]
# Verifies the user JWT itself, same as dispatch, so the shape stays uniform.
verify_jwt = false

[functions.assist]
# Same shape as the others: the function verifies the user JWT itself.
verify_jwt = false

[functions.calendar]
# The only endpoint served without a login: a calendar app cannot present one.
# The token in the query string is the credential, and the function checks it.
verify_jwt = false

[functions.feeds]
# Same shape as dispatch: pg_cron authenticates with the shared secret header,
# and the app with a user JWT that the function verifies itself.
verify_jwt = false
